                </button>
                <a href="admin-home.html" class="navbar-brand d-flex align-items-center text-decoration-none">
                    <img src="img/logo-transparent-white.png" id="logo-sm" alt="Sonido Vivo">
                    <span class="ms-2 fw-bold text-white">Sonido Vivo <span class="d-none d-md-inline">| <span
                                class="text-warning">Panel
                                Administrador</span></span></span>
                </a>
                <div class="d-flex ms-auto">
                    <a href="home.html" class="btn btn-outline-light btn-sm"> <span class="d-sm-inline">Cerrar
                            Sesión</span></a>
                </div>
            </div>
        </nav>
    </header>

    <div class="d-flex flex-grow-1">

        <aside id="sidebar" class="sidebar collapse d-lg-flex flex-column p-3 border-end">
            <nav class="d-flex flex-column flex-grow-1 justify-content-between">
                <ul class="nav nav-pills flex-column gap-1 mb-auto">
                    <li class="nav-item">
                        <a href="admin-home.html" class="nav-link text-body d-flex align-items-center gap-2">

                    <li class="nav-item">

                            <span>Pedidos</span>

                    </li>
                    <li class="nav-item">

                            class="nav-link active text-body d-flex align-items-center gap-2">
                            <i class="bi bi-box-seam"></i>

                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="disabled nav-link text-body d-flex align-items-center gap-2">
                            <i class="bi bi-bar-chart"></i>
                            <span>Reportes</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="admin-usuario.html" class="nav-link text-body d-flex align-items-center gap-2">
                            <i class="bi bi-people"></i>
                            <span>Usuarios</span>
                        </a>
                    </li>
                </ul>

                <ul class="nav nav-pills flex-column gap-1 my-3">
                    <li class="nav-item">
                        <a href="#" class="disabled nav-link text-body d-flex align-items-center gap-2">
                            <i class="bi bi-gear"></i>
                            <span>Configuración</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="disabled nav-link text-body d-flex align-items-center gap-2">
                            <i class="bi bi-person-plus"></i>

                        </a>

                        <a href="#" class="disabled nav-link text-body d-flex align-items-center gap-2">

                        <a href="#" class="disabled nav-link text-body d-flex align-items-center gap-2">

                        </a>
                    </li>
                </ul>
            </nav>
        </aside>
        <main class="container mt-5 pt-5 my-5">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4 p-md-5">
                            <h2 class="h3 fw-bold mb-4 text-primary">Editar producto</h2>
                            <form id="form-crearproducto" novalidate>
                                <div class="mb-3">
                                    <label for="sku" class="form-label fw-semibold">Código de producto (SKU)<span
                                            class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="sku" placeholder="Formato: AB000"
                                        value="BA001" required>
                                </div>

                                <div class="mb-3">
                                    <label for="nombre" class="form-label fw-semibold">Nombre de Producto<span
                                            class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="nombre" placeholder="Ej: Micrófono tipo"
                                        value="Bajo Eléctrico 4 Cuerdas" required>
                                </div>

                                <div class="mb-3">
                                    <label for="marca" class="form-label fw-semibold">Marca</label>
                                    <input type="text" class="form-control" id="marca" placeholder="Ej: Squier"
                                        value="Squier">
                                </div>

                                <div class="mb-3">
                                    <label for="modelo" class="form-label fw-semibold">Modelo</label>
                                    <input type="text" class="form-control" id="modelo" placeholder="Ej: Affinity PJ"
                                        value="Affinity PJ">
                                </div>

                                <div class="mb-3">
                                    <label for="descripcion" class="form-label fw-semibold">Descripción de
                                        Producto</label>
                                    <textarea class="form-control" id="descripcion" rows="2" required
                                        placeholder="Escriba la descripción aquí">El Squier Affinity PJ combina la versatilidad de sus pastillas P y J con la comodidad de un mástil de arce y cuerpo de álamo. Una opción ideal para bajistas que buscan potencia, flexibilidad tonal y la clásica calidad Fender en un solo instrumento.</textarea>
                                </div>

                                <div class="mb-3">
                                    <label for="precio" class="form-label fw-semibold">Precio (Cifra)<span
                                            class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="precio"
                                        placeholder="Escriba cifra sin puntos ni signo $" required value="299999">
                                </div>

                                <div class="mb-3">
                                    <label for="stock" class="form-label fw-semibold">Stock<span
                                            class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="stock"
                                        placeholder="Mínimo 0, sin máximo" required value="5">
                                </div>

                                <div class="mb-3">
                                    <label for="stock-crit" class="form-label fw-semibold">Stock Crítico</label>
                                    <input type="number" class="form-control" id="stock-crit"
                                        placeholder="Mínimo 0, sin máximo" value="2">
                                    <p id="stock-crit-error" class="text-center fw-bold text-danger"></p>
                                </div>

                                <div class="mb-3">
                                    <label for="categoria" class="form-label fw-semibold">Categoría<span
                                            class="text-danger">*</span></label>
                                    <select class="form-select" id="categoria" required>
                                        <option value="" disabled>Selecciona la categoria</option>
                                        <option value="guitarras-acusticas">Guitarras Acústicas</option>
                                        <option value="guitarras-electricas">Guitarras Eléctricas</option>
                                        <option value="bajos-electricos" selected>Bajos Eléctricos</option>
                                        <option value="baterias">Baterías</option>
                                        <option value="teclados-y-pianos">Teclados y Pianos</option>
                                        <option value="amplificadores">Amplificadores</option>
                                        <option value="microfonos">Micrófonos</option>
                                        <option value="pedales-de-efectos">Pedales de Efectos</option>
                                        <option value="accesorios">Accesorios</option>
                                        <option value="estudio-y-grabacion">Estudio y Grabación</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label for="imagen-producto" class="form-label fw-semibold">Subir Imagen del
                                        Producto</label>
                                    <input class="form-control" type="file" id="imagen-producto" accept="image/*">
                                </div>

                                <div class="d-flex justify-content-between align-items-center">
                                    <a href="admin-productos.html" class="btn btn-outline-secondary">Cancelar
                                    </a>
                                    <button type="submit" class="btn btn-success px-4">Guardar Producto</button>
                                </div>
                                <p id="mensaje-exito" class="mt-3 text-center fw-bold text-success"></p>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
